{% extends 'website/base.html' %}

{% block title %}{{ member.name }} - Alphintra{% endblock %}

{% block content %}
<main class="page-content" style="padding-top: 100px; min-height: 100vh;">
  <div class="container profile-hero" style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem;">
    
    <a href="{% url 'home' %}" style="text-decoration: none; color: rgba(255, 255, 255, 0.6); display: inline-block; margin-bottom: 2rem;">&larr; Back to Home</a>

    <!-- Force standard row layout with inline CSS grid to avoid caching issues -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4rem; align-items: center;">
      
      <!-- Left side: Image -->
      <div style="width: 100%; max-width: 500px; margin: 0 auto;">
        <img src="{{ member.image_url }}" alt="{{ member.name }}" style="width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; opacity: 0.95; border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%; -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%); mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);">
      </div>
      
      <!-- Right side: Text -->
      <div style="display: flex; flex-direction: column; justify-content: center;">
        <span class="eyebrow" style="color: rgba(255, 255, 255, 0.7); text-transform: uppercase; letter-spacing: 2px;">{{ member.role }}</span>
        <h1 style="font-size: 3.5rem; margin: 0.5rem 0 1.5rem; line-height: 1.1;">{{ member.name }}</h1>
        <p style="font-size: 1.15rem; line-height: 1.7; color: rgba(255, 255, 255, 0.85);">{{ member.bio }}</p>
      </div>
      
    </div>

  </div>
</main>
{% endblock %}
